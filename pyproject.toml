[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ping-pong"
version = "1.0.0"
description = "AI Ping Pong - Wii Sports inspired table tennis controlled by webcam hand tracking with Databricks Apps analytics"
readme = "README.md"
authors = [{ name = "AI Ping Pong Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "databricks-sdk>=0.20.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
